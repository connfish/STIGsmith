# Fallback for environments without the Aspire CLI (and for air-gapped hosts, where `aspire run`
# pulling images on demand is not an option). `dotnet run --project src/Stigsmith.AppHost` is the
# normal path; this file exists so it is not the only one.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stigsmith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["stigsmith-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stigsmith"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["stigsmith-ollama:/root/.ollama"]

  api:
    build:
      context: .
      dockerfile: src/Stigsmith.Api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ConnectionStrings__stigsmithdb: "Host=postgres;Port=5432;Database=stigsmith;Username=postgres;Password=postgres"
      Stigsmith__Generation__Ollama__BaseUrl: "http://ollama:11434"
      # The validation sandbox drives the host's container runtime. Mounting the socket is what lets
      # a containerised API start sibling validation containers; run the API on the host instead if
      # your policy forbids it.
      DOCKER_HOST: "unix:///var/run/docker.sock"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["8080:8080"]

volumes:
  stigsmith-pgdata:
  stigsmith-ollama:
