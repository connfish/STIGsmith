# Tunable values. House convention: stigsmith_rhel8_<setting>, never a bare name.
stigsmith_rhel8_sshd_config_path: /etc/ssh/sshd_config
stigsmith_rhel8_client_alive_count_max: 1
stigsmith_rhel8_faillock_deny: 3
stigsmith_rhel8_password_minlen: 15
stigsmith_rhel8_gui_idle_delay: 900
stigsmith_rhel8_selinux_type: targeted
