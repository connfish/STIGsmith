# Per-rule toggles. House convention: stigsmith_rhel8_rule_<vuln number>, default true, so an
# operator disables individual rules rather than opting into them one at a time.
stigsmith_rhel8_rule_230240: true
stigsmith_rhel8_rule_230244: true
stigsmith_rhel8_rule_230269: true
stigsmith_rhel8_rule_230271: true
stigsmith_rhel8_rule_230286: true
stigsmith_rhel8_rule_230296: true
stigsmith_rhel8_rule_230301: true
stigsmith_rhel8_rule_230332: true
stigsmith_rhel8_rule_230352: true
stigsmith_rhel8_rule_230380: true
stigsmith_rhel8_rule_230423: true
stigsmith_rhel8_rule_230486: true
