name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything except the live model: the unit suites, the PostgreSQL-backed API suites (Testcontainers), and the
  # validation loop against the real image in a real container. GitHub's runners have Docker, so nothing skips here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build the validation image
        run: make image

      - name: Test
        run: dotnet test -c Release --report-trx --results-directory ./artifacts/test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./artifacts/test

  # The generation path against a real local model. Separate because it needs a model pulled, which is slow and large,
  # and because a model server being down should not fail the build for everything else.
  ollama-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pull the model
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:11434/api/pull -d '{"model":"qwen2.5-coder:7b"}' || true

      - name: Test the live generation path
        env:
          STIGSMITH_OLLAMA_URL: http://localhost:11434
        run: dotnet test -c Release --filter-method '*OllamaProviderTests*'
