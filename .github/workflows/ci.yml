name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Tests that need a container runtime or a model server detect their absence and skip, so this
      # step is green on a runner with neither. The matching suites run in the container job below.
      - name: Test
        run: dotnet test --no-build -c Release --report-trx --results-directory ./artifacts/test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./artifacts/test

  container-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test (with Docker available)
        env:
          STIGSMITH_ENABLE_CONTAINER_TESTS: '1'
        run: dotnet test -c Release
